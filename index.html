<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WizChat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17212b">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="notifySound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox()"><span class="close-lightbox">&times;</span><img id="lightboxImg" src=""></div>
    <div id="menuOverlay" class="menu-overlay" onclick="closeContextMenu()"></div>
    <div id="msgContextMenu" class="msg-context-menu">
        <div class="context-reactions" id="contextReactions"></div>
        <div class="context-actions" id="contextActions"></div>
    </div>
    <div class="modal-overlay" id="fullReactionsModal">
        <div class="modal-content" style="padding: 15px;"><h3 style="margin-bottom: 15px;">Выберите реакцию</h3><div class="full-reactions-grid" id="fullReactionsGrid"></div><button onclick="closeFullReactions()" style="margin-top: 15px; background: var(--bg-input);">Закрыть</button></div>
    </div><div class="modal-overlay" id="forwardModal">
    <div class="modal-content" style="padding: 15px;"><h3 style="margin-bottom: 15px;">Переслать в...</h3><div id="forwardChatList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;"></div><button onclick="hideModal('forwardModal')" style="margin-top: 15px; background: var(--bg-input); color: var(--text-main);">Отмена</button></div>
</div>
<div class="auth-screen" id="authScreen">
    <h1>Вход в WizChat</h1>
    <input type="text" id="loginUsername" placeholder="Юзернейм (на англ.)">
    <input type="password" id="loginPassword" placeholder="Пароль (мин. 6 символов)">
    <button onclick="registerUser()">Зарегистрироваться</button>
    <button onclick="loginUser()">Войти</button>
</div>
<div class="app" id="mainApp" style="display: none;">
    <div class="tab-content active" id="tab-chats">
        <div class="sidebar">
            <div class="search-wrapper">
                <div class="search-bar"><input type="text" id="searchInput" placeholder="Поиск людей, групп, каналов..." oninput="liveSearch()"><button>🔍</button></div>
                <div class="search-results" id="searchResults" style="display: none;"></div>
            </div>
            <div class="header" style="padding: 15px;">Мои чаты</div>
            <div class="chat-list" id="chatList"></div>
        </div>
    </div><div class="tab-content" id="tab-settings">
    <div class="header" style="font-size: 20px; color: var(--text-main);">⚙️ Настройки</div>
    <div class="settings-group">
        <h3>Тема</h3><div class="theme-buttons"><button onclick="changeTheme('dark')">Темная</button><button onclick="changeTheme('light')">Светлая</button></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="changeBubbleColor('#2b5278')" style="background:#2b5278; height:30px; padding:0; color:white;">Синий</button>
            <button onclick="changeBubbleColor('#2ecc71')" style="background:#2ecc71; height:30px; padding:0; color:white;">Зеленый</button>
            <button onclick="changeBubbleColor('#9b59b6')" style="background:#9b59b6; height:30px; padding:0; color:white;">Фиолетовый</button>
            <button onclick="changeBubbleColor('#e67e22')" style="background:#e67e22; height:30px; padding:0; color:white;">Оранжевый</button>
        </div>
    </div>
    <div class="settings-group"><h3>Размер текста</h3><div class="theme-buttons"><button onclick="changeFontSize('small')">Маленький</button><button onclick="changeFontSize('medium')">Средний</button><button onclick="changeFontSize('large')">Большой</button></div></div>
    <div class="settings-group">
        <h3>Приватность</h3>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><span style="color:var(--text-main);">Приватный аккаунт</span><label class="switch"><input type="checkbox" id="privateAccountToggle" onchange="togglePrivateAccount()"><span class="slider"></span></label></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:var(--text-main); font-size: 14px;">Запретить писать первыми</span><label class="switch"><input type="checkbox" id="forbidFirstMsgToggle" onchange="toggleForbidFirstMsg()"><span class="slider"></span></label></div>
    </div>
    <div class="settings-group"><h3>Заблокированные</h3><div id="blockedList" style="display:flex; flex-direction:column; gap:10px; margin-top: 10px;"></div></div>
    <div class="settings-group"><h3>О разработчике</h3><a href="https://t.me/WizChatChannell" target="_blank" style="display:block; text-align:center; background:#2AABEE; color:white; padding:12px; border-radius:10px; text-decoration:none; font-weight:bold; margin-top:10px;">🚀 Telegram-канал разработчика</a></div>
    <div class="settings-group" style="margin-top: 10px;"><button onclick="logoutUser()" style="background: #c0392b; width: 100%; padding: 15px; border-radius: 10px; border: none; color: white; font-weight: bold;">Выйти</button></div>
</div>
